name: MG4 car UI preview (emulator)

# Builds an x86_64 debug APK, runs it in an Android 9 emulator (the head unit runs Android 9)
# at a head-unit-like resolution, and uploads screenshots of the car interface in demo mode.

on:
  workflow_dispatch:
    inputs:
      screen_size:
        description: 'Emulated screen size (WxH): the area OsmAnd gets on the head unit'
        default: '1744x640'
      screen_density:
        description: 'Emulated screen density (dpi)'
        default: '240'
  push:
    branches:
      - car-mode-ui-step1
    paths:
      - '.github/workflows/build-mg4-emulator-preview.yml'
      - '.github/scripts/emulator-preview.sh'
      - 'OsmAnd/src/net/osmand/plus/auto/carmode/**'
      - 'OsmAnd/src/net/osmand/plus/views/layers/MapInfoLayer.java'

permissions:
  contents: write   # needed to publish screenshots to the preview-shots branch

concurrency:
  group: mg4-emulator-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout this fork
        uses: actions/checkout@v7
        with:
          path: android

      - name: Checkout OsmAnd-resources
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-resources
          path: resources

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build x86_64 debug APK
        working-directory: ./android
        env:
          ANDROID_NDK: ''
          ANDROID_NDK_ROOT: ''
          APP_EDITION: mg4-car-ui-preview
        run: |
          chmod +x gradlew
          ./gradlew -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" --no-daemon assembleNightlyFreeOpenglX86Debug
          ls -lh OsmAnd/build/outputs/apk/*/*/*.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run in emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SCREEN_SIZE: ${{ inputs.screen_size || '1744x640' }}
          SCREEN_DENSITY: ${{ inputs.screen_density || '240' }}
        with:
          api-level: 28
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          working-directory: ./android
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-preview.sh "$(ls OsmAnd/build/outputs/apk/*/*/*.apk | head -1)" preview-out

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: car-ui-preview
          path: android/preview-out/
          retention-days: 14
          if-no-files-found: warn

      - name: Publish screenshots to branch preview-shots
        if: always()
        working-directory: ./android
        run: |
          set -e
          d="$(mktemp -d)"
          cp -r preview-out/. "$d/"
          cd "$d"
          git init -q
          git checkout -q -b preview-shots
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Preview screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" preview-shots
